pluginGroup = dev.formwork
pluginVersion = 0.1.0
# Rider release the plugin is built against (latest stable on 4 Nov 2026).
riderVersion = 2026.2.4.1
kotlin.stdlib.default.dependency = false
org.gradle.jvmargs = -Xmx3g
org.gradle.configuration-cache = false
org.gradle.caching = true
# Free IDE the plugin is compiled against by default: 2026.1, the oldest platform Formwork supports, so the zip
# can't use anything only 2026.2 has. (UI screenshots use a local 2026.2.4; Rider needs a login.)
ideaVersion = 2026.1.5.1
